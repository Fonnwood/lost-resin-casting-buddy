<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Casting Buddy</title>
  <meta name="description" content="Process companion and timing dashboard for vacuum-assisted investment casting of resin-printed models.">
  <meta name="theme-color" content="#0b0c0e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casting Buddy">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="brand" data-action="nav" data-arg="now" aria-label="Casting Buddy — go to Now">
      <span class="logo" aria-hidden="true">▲</span><span>Casting Buddy</span>
    </button>
    <div class="top-actions">
      <button type="button" id="wakeBtn" class="iconbtn" data-action="wakeToggle" aria-pressed="false" title="Keep screen awake"><span aria-hidden="true">☀</span><span class="sr">Keep screen awake</span></button>
      <button type="button" class="iconbtn" data-action="nav" data-arg="settings" title="Settings"><span aria-hidden="true">⚙</span><span class="sr">Settings</span></button>
    </div>
  </header>

  <div id="banner" aria-live="assertive"></div>
  <main id="view" aria-live="polite"></main>
  <div id="modal"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <button type="button" data-action="nav" data-arg="now"><span class="ti" aria-hidden="true">◉</span>NOW</button>
    <button type="button" data-action="nav" data-arg="timeline"><span class="ti" aria-hidden="true">☰</span>TIMELINE</button>
    <button type="button" data-action="nav" data-arg="run"><span class="ti" aria-hidden="true">✎</span>RUN</button>
    <button type="button" data-action="nav" data-arg="history"><span class="ti" aria-hidden="true">⏱</span>HISTORY</button>
  </nav>

  <noscript><p style="padding:24px">Casting Buddy needs JavaScript enabled.</p></noscript>

  <script src="config.js"></script>
  <script src="js/util.js"></script>
  <script src="js/profile.js"></script>
  <!-- Profile packs: add your own after this line (see docs/PROFILES.md). -->
  <script src="profiles/protocast-trueblue-cz121.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/alerts.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/ui/now.js"></script>
  <script src="js/ui/timeline.js"></script>
  <script src="js/ui/run.js"></script>
  <script src="js/ui/history.js"></script>
  <script src="js/ui/settings.js"></script>
  <script src="js/ui/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
