server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # The service worker and host config must never be served stale.
  location ~ ^/(sw\.js|config\.js)$ { add_header Cache-Control "no-cache"; }

  location / { try_files $uri =404; }
}
