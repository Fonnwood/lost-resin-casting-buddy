server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  # The service worker and host config must never be served stale.
  location ~ ^/(sw\.js|config\.js)$ { add_header Cache-Control "no-cache"; }

  # Static hosting has no accounts: answer the app's check instead of a 404 (see docs/HOSTING.md).
  location = /api/session { default_type application/json; add_header Cache-Control "no-store"; return 200 '{"accounts":false}'; }

  location / { try_files $uri =404; }
}
