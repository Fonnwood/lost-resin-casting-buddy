name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (engine)
        run: node --test tests/*.test.js
      - name: End-to-end walk-through (phone-sized browser)
        run: |
          npm install --no-save playwright@1.56.1 http-server@14
          npx playwright install --with-deps chromium
          npx http-server -p 8080 -s -c-1 . &
          sleep 2
          node tests/e2e.js http://localhost:8080
