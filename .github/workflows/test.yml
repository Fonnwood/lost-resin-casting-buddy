name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: End-to-end walk-through (phone-sized browser)
        run: |
          npx playwright install --with-deps chromium
          npm start &
          sleep 2
          npm run test:e2e -- http://localhost:8080
