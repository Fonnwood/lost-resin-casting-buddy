name: Tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cb_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit, API (memory + Postgres) and sync tests
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cb_test
      - name: End-to-end walk-through (phone-sized browser)
        run: |
          npx playwright install --with-deps chromium
          npm start &
          sleep 2
          npm run test:e2e -- http://localhost:8080
      - name: End-to-end account sign-in and sync (two phones)
        run: |
          CODE_RESEND_SECONDS=2 node scripts/serve.js 8081 --dev &
          sleep 2
          node tests/e2e-sync.js http://localhost:8081
